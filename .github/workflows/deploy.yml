name: Deploy to GitHub Pages

# 触发条件：push 到 main、main 上手动 dispatch、或 Pages 触发的 deployment
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署 job 需要写权限：Contents（写 commit）、Pages（部署用于 Pages）、id-token（OIDC）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一部署并发时取消旧的，避免覆盖竞争
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull paper metadata
        # 在 build 之前从 OpenAlex 拉一批 CV 三会论文 → public/papers.json
        # 失败不中断 build（脚本内部会写空数组兜底）
        run: node scripts/build-static.mjs

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4